<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="bi bi-people-fill me-2"></i>
      People Management
    </a>

    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link"
         routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      <a class="nav-link"
         routerLink="/people"
         routerLinkActive="active">
        People
      </a>

      <a class="nav-link"
         routerLink="/add-person"
         routerLinkActive="active">
        Add Person
      </a>
    </div>
  </div>
</nav>

@if (notifications.message()) {
  <div
    class="alert alert-dismissible notification-toast shadow"
    [class.alert-success]="notifications.type() === 'success'"
    [class.alert-danger]="notifications.type() === 'danger'"
    role="alert">
    {{ notifications.message() }}
    <button
      type="button"
      class="btn-close"
      aria-label="Close notification"
      (click)="notifications.dismiss()">
    </button>
  </div>
}

<router-outlet></router-outlet>
